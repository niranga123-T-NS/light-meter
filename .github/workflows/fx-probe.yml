name: fx probe (temporary)
on:
  push:
    branches: [claude/fx-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
      - run: |
          mkdir -p fxprobe
          BACKFILL_DAYS=20 python3 fx_fetch.py --dry-run 2>&1 | tee fxprobe/dry.txt
          # OCR text of the latest schedule for checking
          python3 -c "
          import fx_fetch as f
          e,u=f.customs_latest(); t=f.ocr_pdf(f.get(u,True)); open('fxprobe/ocr.txt','w').write(t)
          for u2 in ['https://www.customs.gov.lk/wp-content/uploads/2026/09/er20260914.pdf','https://www.customs.gov.lk/wp-content/uploads/2026/07/er20260720_1.pdf','https://www.customs.gov.lk/wp-content/uploads/2026/08/er10082026.pdf']:
              print(u2, f.parse_customs(f.ocr_pdf(f.get(u2,True))))
          " 2>&1 | tee fxprobe/more.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add fxprobe; git commit -m "probe output [skip ci]"; git push
