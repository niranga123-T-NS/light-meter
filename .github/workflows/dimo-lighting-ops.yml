name: DIMO Lighting Ops – checks

on:
  push:
    paths: ['dimo-lighting-ops/**', '.github/workflows/dimo-lighting-ops.yml']
  pull_request:
    paths: ['dimo-lighting-ops/**', '.github/workflows/dimo-lighting-ops.yml']

defaults:
  run:
    working-directory: dimo-lighting-ops

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dimo-lighting-ops/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo export -p web

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and seed
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
          for f in supabase/migrations/*.sql supabase/seed.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Workflow test (routes A/B/C, RLS, SLA, debtors, samples)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/workflow_test.sql
