# Publishes the latest app code to the installed phone apps (Android and iOS) as an over-the-air update (EAS Update).
# Run it by hand (GitHub → Actions → "DIMO – update phone apps"), as part of a deploy – after the website is updated.
# The phones download it when the app opens or comes back to the front, and offer "Restart now".
#
# Only apps built with the same app version (app.json "version", e.g. 0.6.0) take the update. When a native module is
# added or changed, raise the version and build new apps – older apps then keep their version instead of crashing.
#
# Repository secret needed: EXPO_TOKEN (the same one the build workflows use).
name: DIMO – update phone apps

on:
  workflow_dispatch:

concurrency:
  group: dimo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dimo-lighting-ops
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN repository secret first (expo.dev → Account settings → Access tokens)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dimo-lighting-ops/package-lock.json

      - run: npm ci

      - name: Link the Expo project
        run: npx eas-cli@latest init --non-interactive --force

      - name: Point the app at EAS Update
        run: |
          id=$(jq -r '.expo.extra.eas.projectId // empty' app.json)
          if [ -z "$id" ]; then echo "::error::No Expo project id in app.json after eas init"; exit 1; fi
          jq --arg u "https://u.expo.dev/$id" '.expo.updates.url = $u' app.json > app.tmp.json && mv app.tmp.json app.json

      # the same public settings the app is built with (eas.json), and the version shown in the app
      - name: Publish the update
        run: |
          export EXPO_PUBLIC_SUPABASE_URL=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' eas.json)
          export EXPO_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_ANON_KEY' eas.json)
          export EXPO_PUBLIC_BUILD_ID="$GITHUB_SHA"
          export EXPO_PUBLIC_BUILD_TIME="$(TZ=Asia/Colombo date +'%d %b %H:%M')"
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest update --channel production --environment production --platform all --non-interactive \
            --message "$(git log -1 --format=%s | cut -c1-200)"
          echo "### Phone apps updated (app version $(jq -r .expo.version app.json))" >> "$GITHUB_STEP_SUMMARY"
