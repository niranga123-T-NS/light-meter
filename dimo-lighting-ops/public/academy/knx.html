<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIMO Academy</title><meta name="robots" content="noindex">
<style>
:root{--red:#c8102e;--ink:#14161c;--mut:#5f6673;--line:#e3e5ea;--bg:#f4f5f7;--side:#1b1d24;--chip:#eef0f4;--s1:#2a6fdb;--s2:#c2410c;--good:#15803d;--warn:#b45309;--sel:#2a6fdb}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--side);color:#cfd3dc;padding:16px 12px;flex-shrink:0}
.logo{background:#fff;color:#1d3c8f;font-weight:900;font-size:26px;border-radius:10px;padding:14px;text-align:center}
.side .sub{font-size:12px;margin:8px 4px 16px}.side a{display:block;padding:7px 8px;border-radius:6px;color:#cfd3dc}.side a.on{background:#2c2f39;color:#fff;font-weight:600}
.main{flex:1;min-width:0}.top{background:#fff;padding:16px 24px;font-weight:700;font-size:20px;border-bottom:1px solid var(--line)}
.wrap{padding:16px 20px;max-width:1120px;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;cursor:pointer}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.mod{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.mod.on{border-color:var(--red)}.mod b{display:block;font-size:15px}.mod .m{font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
h2{margin:0 0 4px;font-size:20px}h3{margin:18px 0 8px;font-size:15px}.m{color:var(--mut)}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;width:220px}.bar i{display:block;height:100%;background:var(--red)}
.sec{margin-top:18px;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:8px}
.topic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;position:relative}
.topic:hover{border-color:var(--red)}.topic .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:8px}
.topic b{display:block}.topic .t{font-size:12px;color:var(--mut)}.done{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:var(--good)}
.live{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:99px;padding:1px 8px}
.btn{display:inline-block;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.p{background:var(--red);color:#fff;border-color:var(--red)}.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.part{display:flex;gap:10px;align-items:flex-start;margin-top:16px}.num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.part .body{flex:1;min-width:0}.part h4{margin:2px 0 6px;font-size:15px}
.say{background:#f0f6ff;border-left:4px solid var(--s1);padding:10px 12px;border-radius:6px}
.watch{background:#fff7ed;border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px}
.scene{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.scene svg{width:100%;height:auto;border-radius:10px;display:block}.scene .cap{text-align:center;font-size:12px;color:var(--mut);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--red)}
.kelvin{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip)}
.q{margin-top:10px}.q p{margin:0 0 6px;font-weight:600}.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit}
.opt.ok{background:#dcfce7;border-color:var(--good)}.opt.no{background:#fee2e2;border-color:#dc2626}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.inputs label{font-size:12px;color:var(--mut)}.inputs input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.kpis div{background:var(--chip);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.kpis b{display:block;font-size:20px;color:var(--ink)}
.legend{display:flex;gap:16px;font-size:13px;margin-bottom:4px;flex-wrap:wrap}.legend span::before{content:'';display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.chartbox{position:relative}.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);display:none;white-space:nowrap;z-index:2}
.hidden{display:none!important}.crumb{color:var(--mut);margin-bottom:8px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 18px;margin-top:10px}
.ctl label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}.ctl label b{color:var(--ink)}
.stage{background:#0f1218;border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.info{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:150px}
.info h5{margin:0 0 4px;font-size:15px}.info .k{font-size:12px;color:var(--mut);margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.plist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.plist .btn{padding:4px 9px;font-size:12px}
[data-part]{cursor:pointer}
table.spec{width:100%;border-collapse:collapse;font-size:13px}table.spec td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}table.spec td:first-child{color:var(--mut);width:38%}
.three{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.phr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.phr details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:#fff}.phr summary{cursor:pointer;font-weight:700;font-size:14px}.phr details[open]{border-color:var(--s1);background:#f0f6ff}.phr details div{margin-top:6px}
@media(max-width:900px){.three{grid-template-columns:1fr 1fr}.four{grid-template-columns:1fr 1fr}.scene,.two{grid-template-columns:1fr!important}.mods{grid-template-columns:1fr 1fr}.wrap{padding:12px 12px}.kpis{grid-template-columns:1fr 1fr!important}}
@media(max-width:560px){.four,.three{grid-template-columns:1fr}}
#ipKpi b{font-size:15px}

</style><style>.opt.on{outline:2px solid var(--p,#1F6FEB);background:rgba(31,111,235,.08)} .tablewrap{overflow-x:auto} table.spec td:first-child{white-space:normal}</style></head><body>
<div class="wrap">
<div id="home">
  <div class="card hero">
    <div><h2 id="hTitle"></h2><div class="m" id="hSub"></div><div class="m" id="saveNote" style="font-size:12px;margin-top:4px"></div></div>
    <div><div class="m" style="font-size:12px;margin-bottom:4px" id="progText">Your progress</div><div class="bar"><i id="progBar" style="width:0%"></i></div><div style="margin-top:8px" id="contBtn"></div></div>
  </div>
  <div class="mods" id="mods"></div>
  <div id="modBody"></div>
</div>
<div id="lesson" class="hidden">
  <div class="crumb" onclick="back()" id="lCrumb">◀ All lessons</div>
  <div class="card">
    <div class="hero"><div><span class="pill" id="lPill"></span><h2 style="margin-top:6px" id="lTitle"></h2></div><span class="m" id="lDone"></span></div>
    <div class="part"><div class="num">1</div><div class="body"><h4>In one line</h4><div id="lLine"></div><div id="lBody" style="margin-top:8px"></div></div></div>
    <div class="part" id="lSeeP"><div class="num">2</div><div class="body"><h4>Try it</h4><div id="lSee"></div></div></div>
    <div class="part" id="lDoP"><div class="num">3</div><div class="body"><h4>On site</h4><div class="say" id="lDo"></div></div></div>
    <div class="part" id="lWatchP"><div class="num">4</div><div class="body"><h4>Watch out</h4><div class="watch" id="lWatch"></div></div></div>
    <div class="part"><div class="num">5</div><div class="body"><h4>Quick check</h4><div id="lQuiz"></div></div></div>
  </div>
</div>
<div id="examv" class="hidden">
  <div class="crumb" onclick="back()" id="xCrumb">◀ All lessons</div>
  <div class="card">
    <div class="hero"><div><span class="pill">Mock exam</span><h2 style="margin-top:6px" id="xTitle"></h2></div><span class="m" id="xDone"></span></div>
    <div id="xIntro" style="margin:8px 0"></div><div id="xBody"></div>
  </div>
</div>
</div>
<script>
// Course engine (Dacademy technical courses): home with modules, lessons (in one line · try it · on site · watch out · quick check),
// live labs drawn into a lesson, timed mock exams, progress saved through the person's sign-in like the Lighting Academy
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const Q = (q, opts, c, why) => [q, opts, c, why];
const L = [];
const add = (mod, sec, id, icon, title, o) => L.push({ mod, sec, id: COURSE.prefix + id, icon, title, mins: 3, ...o });
const LABS = {};
const EXAMS = {};
let LESSONS = {};
const BG = ['#e0f2fe', '#dcfce7', '#fef3c7', '#ede9fe', '#fce7f3', '#ffedd5', '#e0e7ff', '#f1f5f9'];

// ---- quiz (options shuffled the same way every time for a lesson)
function seeded(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; }; }
function renderQuiz(el, les) {
  const rnd = seeded(les.id); let right = 0, answered = 0;
  el.innerHTML = les.quiz.map(([q, opts, c], qi) => { const order = opts.map((o, i) => [o, i, rnd()]).sort((a, b) => a[2] - b[2]); return `<div class="q" data-c="${c}" data-qi="${qi}"><p>${qi + 1}. ${q}</p>${order.map(([o, i]) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}<div class="m why" style="font-size:12px;margin-top:4px"></div></div>`; }).join('') + `<div id="qRes_${les.id}" style="margin-top:8px"></div>`;
  el.querySelectorAll('.q').forEach((qd) => qd.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
    if (qd.dataset.done) return; qd.dataset.done = 1; answered++; const ok = +b.dataset.i === +qd.dataset.c; if (ok) right++;
    b.classList.add(ok ? 'ok' : 'no'); qd.querySelector(`.opt[data-i="${qd.dataset.c}"]`).classList.add('ok');
    const why = les.quiz[+qd.dataset.qi][3]; if (why) qd.querySelector('.why').innerHTML = (ok ? '✓ ' : '✗ ') + why;
    if (answered === les.quiz.length) finish(les, right, les.quiz.length, el);
  }));
}
function finish(les, score, total, el) {
  const pass = score * 3 >= total * 2, nx = nextLesson(les.id);
  record(les.id, score, total);
  el.querySelector(`#qRes_${les.id}`).innerHTML = `<b>${score} of ${total} right.</b> ${pass ? 'Lesson complete ✓' : 'Read it again and retry – 2 of 3 completes the lesson.'} <span class="btn" style="padding:4px 9px;font-size:12px" onclick="openLesson('${les.id}');route()">Retry</span>${nx ? ` <span class="btn p" style="padding:4px 9px;font-size:12px" onclick="openLesson('${nx.id}')">Next: ${esc(nx.title)} ▶</span>` : ''}`;
}
const nextLesson = (id) => { const i = L.findIndex((l) => l.id === id); return L[i + 1] && L[i + 1].mod === L[i].mod ? L[i + 1] : L.find((l, k) => k > i && !(prog[l.id] && prog[l.id].done)); };

// ---- progress (Supabase through the app's sign-in, passed in by the app)
let cfg = null, prog = {};
function api(fn, body) { if (!cfg) return Promise.resolve(null); return fetch(`${cfg.sb}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: cfg.key, Authorization: `Bearer ${cfg.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => (r.ok ? r.json().catch(() => null) : Promise.reject(r))); }
function record(id, score, total) {
  const p = prog[id] || { best: 0, attempts: 0, done: false }; p.attempts++; p.best = Math.max(p.best, score); p.total = total; p.done = p.done || score * 3 >= total * 2; prog[id] = p;
  if (window.parent !== window) window.parent.postMessage({ type: 'academy:progress', lesson: id, score, total }, '*');
  api('academy_record', { p_lesson: id, p_score: score, p_total: total }).catch(() => { $('saveNote').textContent = 'Could not save your progress – open the course again from the app.'; });
}
function loadProgress() { return api('academy_mine').then((rows) => { if (rows) { prog = {}; rows.forEach((r) => { if (r.lesson.startsWith(COURSE.prefix)) prog[r.lesson] = { best: r.best, total: r.total, attempts: r.attempts, done: r.done }; }); } renderHome(); }).catch(() => { $('saveNote').textContent = 'Could not load your progress.'; }); }
function setCfg(c) { cfg = c; $('saveNote').textContent = c ? `Signed in as ${c.name} – your progress is saved.` : 'Open from the DIMO app (Sales Tools → Dacademy) to save your progress.'; loadProgress(); }
window.addEventListener('message', (e) => { if (e.data && e.data.type === 'academy:cfg') setCfg(e.data.cfg); });

// ---- home
let mod = null;
function renderHome() {
  if (!mod) mod = MODULES[0][0];
  const doneN = L.filter((l) => prog[l.id] && prog[l.id].done).length;
  $('progText').textContent = `Your progress · ${doneN} of ${L.length} lessons`; $('progBar').style.width = `${Math.round((100 * doneN) / L.length)}%`;
  const nx = L.find((l) => !(prog[l.id] && prog[l.id].done)); $('contBtn').innerHTML = nx ? `<span class="btn p" onclick="openLesson('${nx.id}')">${doneN ? 'Continue' : 'Start'}: ${esc(nx.title)} ▶</span>` : '<b style="color:var(--good)">All lessons complete ✓</b>';
  $('mods').innerHTML = MODULES.map(([k, n, sub]) => { const ls = L.filter((l) => l.mod === k), d = ls.filter((l) => prog[l.id] && prog[l.id].done).length; return `<div class="mod ${k === mod ? 'on' : ''}" onclick="mod='${k}';renderHome()"><b>${n}</b><span class="m">${sub}</span><span class="m" style="display:block;font-size:11px;margin-top:4px;color:var(--good)">${d} / ${ls.length} done</span></div>`; }).join('');
  const secs = [...new Set(L.filter((l) => l.mod === mod).map((l) => l.sec))];
  $('modBody').innerHTML = secs.map((sec) => `<div class="sec">${sec}</div><div class="grid">${L.filter((l) => l.mod === mod && l.sec === sec).map((l, i) => { const p = prog[l.id];
    return `<div class="topic" onclick="openLesson('${l.id}')">${p && p.done ? `<span class="done">✓ ${p.best}/${p.total}</span>` : l.exam ? '<span class="live">● EXAM</span>' : l.lab ? '<span class="live">● LIVE</span>' : ''}<div class="ic" style="background:${BG[i % BG.length]}">${l.icon}</div><b>${esc(l.title)}</b><span class="m" style="font-size:12px">${l.exam ? `${EXAMS[l.exam].n} questions · ${EXAMS[l.exam].min} min` : `${l.mins} min`}</span></div>`; }).join('')}</div>`).join('');
}

// ---- lessons
function showView(v) { ['home', 'lesson', 'examv'].forEach((x) => $(x).classList.toggle('hidden', x !== v)); window.scrollTo(0, 0); }
function back() { location.hash = '#home'; }
function openLesson(id) { if (location.hash !== '#l/' + id) location.hash = '#l/' + id; else route(); }
const MODN = () => Object.fromEntries(MODULES.map(([k, n]) => [k, n]));
function route() {
  clearInterval(EXT);
  const h = location.hash.replace(/^#/, ''); if (!h.startsWith('l/')) { showView('home'); renderHome(); return; }
  const les = LESSONS[h.slice(2)]; if (!les) { showView('home'); renderHome(); return; }
  mod = les.mod; const p = prog[les.id], doneTxt = p && p.done ? `✓ Completed · best ${p.best}/${p.total}` : '';
  if (les.exam) { examStart(les, doneTxt); return; }
  showView('lesson');
  $('lCrumb').textContent = `◀ All lessons · ${MODN()[les.mod]}`; $('lPill').textContent = `${les.mins} min${les.lvl ? ' · ' + les.lvl : ''}`; $('lTitle').textContent = les.title; $('lDone').innerHTML = doneTxt ? `<b style="color:var(--good)">${doneTxt}</b>` : '';
  $('lLine').innerHTML = les.line; $('lBody').innerHTML = les.body || ''; $('lDo').innerHTML = les.do || ''; $('lWatch').innerHTML = les.watch || '';
  $('lDoP').classList.toggle('hidden', !les.do); $('lWatchP').classList.toggle('hidden', !les.watch);
  $('lSee').innerHTML = ''; $('lSeeP').classList.toggle('hidden', !les.lab);
  if (les.lab) { try { LABS[les.lab]($('lSee'), les.preset); } catch (e) { $('lSee').textContent = 'This lab could not start: ' + e.message; } }
  renderQuiz($('lQuiz'), les);
}
window.addEventListener('hashchange', route);

// ---- mock exams: questions drawn from a bank, a timer, a result out of 10 saved like a lesson (pass mark per exam), and a review
let EXT = null;
function examStart(les, doneTxt) {
  const E = EXAMS[les.exam]; showView('examv');
  $('xCrumb').textContent = `◀ All lessons · ${MODN()[les.mod]}`; $('xTitle').textContent = les.title; $('xDone').innerHTML = doneTxt ? `<b style="color:var(--good)">${doneTxt}</b>` : '';
  $('xIntro').innerHTML = `${les.line}<p class="m" style="margin-top:6px">${E.n} questions drawn at random from ${E.bank.length} · ${E.min} minutes · pass mark ${E.pass} % · you can take it again as often as you like.</p><span class="btn p" id="xGo">Start the exam ▶</span>`;
  $('xBody').innerHTML = ''; $('xGo').onclick = () => examRun(les);
}
function examRun(les) {
  const E = EXAMS[les.exam], shuf = (a) => a.map((x) => [x, Math.random()]).sort((p, q) => p[1] - q[1]).map(([x]) => x), qs = shuf([...E.bank]).slice(0, E.n).map(([q, opts, c, why]) => { const ord = shuf(opts.map((o, i) => i)); return [q, ord.map((i) => opts[i]), ord.indexOf(c), why]; }), ans = new Array(qs.length).fill(null); let left = E.min * 60;
  $('xIntro').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b id="xClock"></b><span class="m" id="xCount"></span><span class="btn p" id="xEnd">Finish and mark</span></div>`;
  $('xBody').innerHTML = qs.map(([q, opts], qi) => `<div class="q" data-qi="${qi}"><p>${qi + 1}. ${q}</p>${opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`).join('');
  const cnt = () => { $('xCount').textContent = `${ans.filter((a) => a !== null).length} of ${qs.length} answered`; }; cnt();
  $('xBody').querySelectorAll('.q').forEach((qd) => qd.querySelectorAll('.opt').forEach((b) => b.onclick = () => { ans[+qd.dataset.qi] = +b.dataset.i; qd.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === b)); cnt(); }));
  const tick = () => { left--; $('xClock').textContent = `⏱ ${Math.floor(Math.max(0, left) / 60)}:${String(Math.max(0, left) % 60).padStart(2, '0')}`; if (left <= 0) mark(); };
  const mark = () => { clearInterval(EXT); const right = qs.filter((q, i) => ans[i] === q[2]).length, pct = Math.round((100 * right) / qs.length), ten = Math.round((10 * right) / qs.length), pass = pct >= E.pass;
    record(les.id, Math.min(10, ten), 10); if (pass && prog[les.id]) prog[les.id].done = true;
    $('xIntro').innerHTML = `<div class="kpis"><div><b>${right} / ${qs.length}</b>right</div><div><b style="color:var(--${pass ? 'good' : 'bad'})">${pct} %</b>${pass ? 'pass ✓' : `pass mark ${E.pass} %`}</div><div><b>${ten} / 10</b>saved to your progress</div></div><p class="m">${pass ? 'Well done – review the ones you missed below.' : 'Study the lessons for the questions you missed (below) and try again – new questions are drawn each time.'}</p><span class="btn p" id="xAgain">Take it again</span> <span class="btn" onclick="back()">Back to the lessons</span>`;
    $('xAgain').onclick = () => examRun(les);
    $('xBody').innerHTML = qs.map(([q, opts, c, why], i) => { const ok = ans[i] === c; return `<div class="q"><p>${ok ? '✓' : '✗'} ${i + 1}. ${q}</p>${opts.map((o, k) => `<button class="opt ${k === c ? 'ok' : k === ans[i] ? 'no' : ''}" disabled>${o}</button>`).join('')}${why ? `<div class="m" style="font-size:12px;margin-top:4px">${why}</div>` : ''}</div>`; }).join(''); window.scrollTo(0, 0); };
  $('xEnd').onclick = () => { if (ans.some((a) => a === null) && !confirm('Some questions are not answered yet. Mark the exam now?')) return; mark(); };
  tick(); EXT = setInterval(tick, 1000);
}

// ---- small helpers for labs
const sl = (id, label, mi, ma, st, v, unit = '') => `<div><label>${label} <b id="${id}V"></b></label><input type="range" id="${id}" min="${mi}" max="${ma}" step="${st}" value="${v}" data-unit="${unit}"></div>`;
const bind = (el, fn) => { el.querySelectorAll('input,select').forEach((i) => i.addEventListener('input', fn)); el.querySelectorAll('input[type=range]').forEach((i) => { const u = () => { const b = $(i.id + 'V'); if (b) b.textContent = i.value + (i.dataset.unit || ''); }; i.addEventListener('input', u); u(); }); fn(); };
const kpi = (rows) => `<div class="kpis">${rows.map(([v, t, bad]) => `<div><b${bad === true ? ' style="color:var(--bad)"' : bad === false ? ' style="color:var(--good)"' : ''}>${v}</b>${t}</div>`).join('')}</div>`;
const chip = (on, txt, js) => `<span class="btn ${on ? 'on' : ''}" style="padding:4px 9px;font-size:12px" onclick="${js}">${txt}</span>`;

function start() {
  LESSONS = Object.fromEntries(L.map((l) => [l.id, l]));
  document.title = COURSE.title; $('hTitle').textContent = COURSE.title; $('hSub').textContent = COURSE.sub;
  const m = location.hash.match(/cfg=([^&]+)/);
  if (m) { try { const c = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); history.replaceState(null, '', location.pathname + '#home'); setCfg(c); } catch { setCfg(null); } }
  else if (window.parent !== window) { $('saveNote').textContent = 'Connecting…'; window.parent.postMessage({ type: 'academy:ready' }, '*'); }
  else setCfg(null);
  route();
}

add('cert', '3 · Power and cable', 'cable', '🧵', 'Bus cable and installation rules', { lvl: 'Certificate', lab: 'cable',

  quiz: [Q('A short press on a blind button usually…', ['Stops or steps the slats', 'Moves fully down', 'Switches the light'], 0), Q('Wind alarm telegrams should be…', ['Sent cyclically and monitored', 'Sent once a year', 'Not needed'], 0), Q('A room controller sends to the heating actuator…', ['A valve position / control value', 'A scene number', 'An IP address'], 0)] });

add('jung', 'System devices', 'jsys', '🧰', 'JUNG system devices', { lvl: 'Certificate',
  line: 'Every JUNG KNX installation starts with system devices on the DIN rail: <b>power supply</b> (320 / 640 mA, versions with diagnostics), <b>interface</b> to ETS (USB or KNX IP interface) and <b>couplers</b> – today usually a <b>KNX IP router</b> (e.g. IPR 300 SREG) as line or backbone coupler.',
  body: '<table class="spec"><tr><td>KNX power supply</td><td>320 mA or 640 mA, DIN rail; diagnostic versions show bus current/voltage</td></tr><tr><td>KNX USB data interface</td><td>Laptop → bus for ETS on small jobs</td></tr><tr><td>KNX IP interface (e.g. IPS 300 SREG)</td><td>ETS / visualisation access over the LAN (tunnelling)</td></tr><tr><td>KNX IP router (e.g. IPR 300 SREG)</td><td>Couples lines over Ethernet (routing) and gives tunnelling access</td></tr><tr><td>Line repeater / coupler</td><td>Extends a line or couples TP lines</td></tr></table><p class="m">Article numbers and Secure variants change between catalogue years – always pick from the current JUNG catalogue / ETS database.</p>',
  do: 'Standard JUNG panel for one floor: power supply 640 mA, IP router as line coupler, actuators, and a spare DIN-rail row for growth.',
  watch: 'Do not order a USB interface as the only ETS access for a large building – an IP interface/router lets you commission and support remotely.',
  quiz: [Q('Which JUNG device couples lines over Ethernet?', ['KNX IP router', 'Push-button module', 'Presence detector'], 0), Q('ETS reaches the bus over the LAN through…', ['A KNX IP interface or router (tunnelling)', 'A DALI ballast', 'A dimmer'], 0), Q('Where do you confirm article numbers?', ['Current JUNG catalogue / ETS database', 'Old quotes', 'Memory'], 0)] });
add('jung', 'Actuators', 'jact', '🎚️', 'JUNG actuators: switch, dim, blind, heating', { lvl: 'Certificate',
  line: 'JUNG <b>actuators</b> sit in the distribution board and do the switching: switch actuators (4/8/16 channels, some with current detection), universal / LED <b>dimmer actuators</b>, <b>blind actuators</b> and <b>heating actuators</b> for valve drives.',
  body: '<table class="spec"><tr><td>Switch actuator</td><td>C-load / high inrush rated relays for LED drivers; current detection for load monitoring and run-hours</td></tr><tr><td>Universal dimmer</td><td>Leading / trailing edge, LED mode; check the minimum and maximum load per channel</td></tr><tr><td>Blind / shutter actuator</td><td>230 V or 24 V DC motors; run-time, slat, safety (wind/rain)</td></tr><tr><td>Heating actuator</td><td>Drives 230 V / 24 V thermoelectric valves with PWM</td></tr><tr><td>Combined / room actuators</td><td>Hotel rooms: switch + dim + blind + heating in one device</td></tr></table>',
  do: 'Size switch actuators by the <b>inrush</b> of LED drivers (number of drivers per channel from the actuator data), not only by the watts.',
  watch: 'Twenty LED drivers on one 16 A relay channel can weld the contact on inrush. Spread drivers or use an actuator rated for capacitive loads.',
  quiz: [Q('Switch actuators for LED drivers must be checked for…', ['Inrush current / number of drivers', 'Colour only', 'Bus voltage only'], 0), Q('Current detection on a switch actuator gives…', ['Load monitoring and run-hours', 'Wi-Fi', 'Dimming'], 0), Q('A heating actuator drives…', ['Thermoelectric valve drives', 'Blinds', 'DALI lamps'], 0)] });
add('jung', 'Actuators', 'jdali', '🌈', 'JUNG KNX DALI gateway', { lvl: 'Advanced',
  line: 'For professional lighting we use a <b>KNX DALI gateway</b>: KNX sends switch/dim/scene telegrams, the gateway drives up to 64 DALI drivers in up to 16 groups, with <b>tunable white (DT8)</b> on suitable models, emergency monitoring and fault feedback.',
  body: '<table class="spec"><tr><td>DALI line</td><td>Up to 64 short addresses, 16 groups, 16 scenes per gateway output</td></tr><tr><td>Group vs individual</td><td>Control groups (fewer objects) or each driver (more flexibility, more objects)</td></tr><tr><td>DT8 Tunable White</td><td>Colour temperature as its own object (Kelvin, DPT 7.600)</td></tr><tr><td>Feedback</td><td>Lamp failure, driver failure, DALI short circuit – to the visualisation / BMS</td></tr><tr><td>Commissioning</td><td>Address the DALI drivers (gateway / ETS app), assign to groups, then link KNX objects</td></tr></table>',
  do: 'Plan DALI groups with the lighting design: one group per zone that ever needs separate control (window row, corridor, presentation).',
  watch: 'DALI is not KNX: its 64-device limit and its own wiring (2-wire, polarity-free, up to 300 m) apply on top of KNX rules.',
  quiz: [Q('Devices per DALI line on a gateway output:', ['64', '256', '15'], 0), Q('Tunable white needs drivers of type…', ['DT8', 'DT1', 'Any'], 0), Q('DALI failures can be reported to…', ['KNX visualisation / BMS through the gateway', 'Nobody', 'Only the driver LED'], 0)] });
add('jung', 'Sensors and room control', 'jsens', '🔘', 'JUNG push-buttons, room controllers, presence', { lvl: 'Certificate',
  line: 'On the wall: JUNG <b>push-button sensors / modules</b> (1–4 gangs, RGB status LEDs, some with display and temperature sensor) in the client’s chosen design line, <b>room controllers</b> for HVAC, and <b>presence / motion detectors</b> on the ceiling.',
  body: '<table class="spec"><tr><td>Push-button modules</td><td>KNX push-button modules (e.g. F 40 / F 50 families) on a bus coupler; rockers per function; status LEDs</td></tr><tr><td>Push-button with display</td><td>Room temperature control + functions in one device</td></tr><tr><td>Design lines</td><td>LS 990, LS ZERO, A 550, A FLOW, CD 500 … – one design through the building</td></tr><tr><td>Presence detectors</td><td>Ceiling-mounted; lighting channels with daylight measurement, HVAC channel, master/slave</td></tr><tr><td>Binary inputs</td><td>Bring in existing switches, window contacts, alarms</td></tr><tr><td>Weather station</td><td>Wind, rain, brightness, temperature for blinds and façade</td></tr></table>',
  do: 'Confirm the design line and colour with the architect before ordering – push-button frames are the most visible part of the job.',
  watch: 'Presence detectors in a meeting room set to “switch on automatically” annoy users during presentations – use “semi-automatic” (manual on, auto off) where people present.',
  quiz: [Q('Which device holds a lux set-point and switches off when the room is empty?', ['Presence detector', 'Power supply', 'Line coupler'], 0), Q('Push-button status LEDs show…', ['The state reported by the actuator', 'Bus voltage', 'Time'], 0), Q('Window contacts are connected through…', ['A binary input', 'A dimmer', 'A DALI gateway'], 0)] });
add('jung', 'Visualisation and design', 'jvis', '📱', 'JUNG visualisation and app control', { lvl: 'Advanced',
  line: 'Users control and monitor through <b>visualisation</b>: JUNG servers and apps (e.g. JUNG Visu Pro, Smart Visu Server) and wall <b>touch panels</b> – all reading and writing group addresses through a KNX IP interface or router.',
  body: '<table class="spec"><tr><td>Server</td><td>Connects to KNX over IP (tunnelling / routing); stores pages, timers, logic, alarms</td></tr><tr><td>Clients</td><td>PC, tablet, phone apps; touch panels on the wall</td></tr><tr><td>Remote</td><td>Through the maker’s secure remote service or the client’s VPN – never by port forwarding</td></tr><tr><td>Secure</td><td>With KNX Secure, the visualisation needs the project’s keyring to read encrypted group addresses</td></tr></table>',
  do: 'Every visualisation object should use the <b>status</b> address for display and the <b>command</b> address for action.',
  watch: 'Each tunnelling connection uses one tunnel of the IP interface/router. Visualisation + ETS + BMS may need more tunnels than one device offers – plan them.',
  quiz: [Q('A visualisation shows a light as ON based on…', ['The actuator status address', 'The last button press', 'The time of day'], 0), Q('Remote access to a JUNG visualisation should be through…', ['A secure remote service or VPN', 'Port forwarding', 'An open Wi-Fi'], 0), Q('With KNX Secure the visualisation needs…', ['The project keyring', 'Nothing extra', 'A new cable'], 0)] });
add('jung', 'Project planning', 'jplan', '📋', 'Planning a JUNG KNX project', { lvl: 'Advanced', lab: 'jung',
  line: 'Turn the room schedule into a device list: per room the push-buttons, presence detectors and room controllers; per board the actuator <b>channels</b> (switch, dim, DALI, blind, heating), then system devices, power and spare capacity.',
  body: '<table class="spec"><tr><td>Count channels</td><td>Lighting circuits, DALI groups, blinds, valves per room</td></tr><tr><td>Choose actuators</td><td>Channels ÷ channels per device, + 15–20 % spare</td></tr><tr><td>Bus devices per line</td><td>Add all sensors + actuators + system devices; keep ≤ ~50 per line</td></tr><tr><td>Power</td><td>Current per line from data sheets; 640 mA supply per line</td></tr><tr><td>IP backbone</td><td>IP routers as line couplers; LAN with IGMP snooping; interface for ETS / visualisation</td></tr></table>',
  do: 'Use the lab to estimate a project, then build the real list in ETS with current JUNG products.',
  watch: 'Quoting actuators without spare channels makes every later change a new DIN-rail device and a new cable to the board.',
  quiz: [Q('Spare actuator channels to plan:', ['15–20 %', '0 %', '100 %'], 0), Q('Bus devices per line – comfortable maximum:', ['About 50', '255', '5'], 0), Q('Lines are usually coupled in new projects by…', ['KNX IP routers', 'Telephone cable', 'DALI'], 0)] });

// ================================================================ ADVANCED
add('adv', 'KNX IP', 'ip', '🌐', 'KNX IP: tunnelling and routing', { lvl: 'Advanced',
  line: '<b>Tunnelling</b> = a point-to-point connection from a PC / visualisation to the bus (unicast, UDP 3671). <b>Routing</b> = KNX IP routers exchange telegrams by multicast (<b>224.0.23.12</b>, UDP 3671) – the IP network becomes the main line / backbone.',
  body: '<table class="spec"><tr><td>Tunnelling</td><td>Each client uses one tunnel; IP interfaces/routers offer a limited number of tunnels, each with its own individual address</td></tr><tr><td>Routing</td><td>Multicast – switches need IGMP snooping + querier; routers must be in the same multicast domain (or use a multicast router)</td></tr><tr><td>Speed</td><td>IP is ~1000× faster than TP; a router buffers when the TP line is slower</td></tr><tr><td>Addresses</td><td>IP router as line coupler: 1.1.0; its tunnels get e.g. 1.1.250–1.1.254</td></tr></table>',
  do: 'Give every KNX IP device a static IP from the project plan, keep KNX IP in its own VLAN, and never expose UDP 3671 to the internet.',
  watch: 'Routing multicast blocked by the client’s IT (no IGMP querier, or multicast filtered between VLANs) makes lines go silent to each other.',
  quiz: [Q('KNX IP routing uses…', ['Multicast 224.0.23.12, UDP 3671', 'Broadcast to everyone', 'TCP 80'], 0), Q('ETS connecting to one line over the LAN uses…', ['Tunnelling', 'Routing only', 'DALI'], 0), Q('Each tunnelling connection needs…', ['A free tunnel with its own individual address', 'A new cable', 'Nothing'], 0)] });
add('adv', 'KNX Secure', 'secure', '🔐', 'KNX Secure: Data Secure and IP Secure', { lvl: 'Advanced',
  line: '<b>KNX Data Secure</b> authenticates and encrypts group telegrams end-to-end (AES-128 CCM with sequence counters, stops replay). <b>KNX IP Secure</b> protects tunnelling and routing on IP. Secure devices are added with their <b>FDSK</b> (Factory Default Setup Key).',
  body: '<table class="spec"><tr><td>FDSK</td><td>Printed / QR on the device and a card; ETS needs it to take over the device – keep it with the project</td></tr><tr><td>Project password</td><td>A secure project is encrypted – lose the password and the system cannot be changed</td></tr><tr><td>Keyring</td><td>Exported from ETS for visualisations / gateways that must read secure addresses</td></tr><tr><td>Mixing</td><td>Secure and plain devices can coexist; a group address is secure only if all its devices support it</td></tr><tr><td>When</td><td>Outdoor / accessible bus cables, hotels, offices, anything on a shared IP network</td></tr></table>',
  do: 'Photograph and store every FDSK with the project, and keep the project password in the company password manager.',
  watch: 'Resetting a secure device needs its FDSK. Without it the device may be unusable in another project.',
  quiz: [Q('What is the FDSK?', ['Factory key needed to commission a secure device', 'A fuse', 'A DALI scene'], 0), Q('Data Secure protects…', ['Group telegrams end-to-end', 'Only Wi-Fi', 'Nothing on TP'], 0), Q('If the secure project password is lost…', ['Changes become impossible', 'Nothing happens', 'ETS resets it'], 0)] });
add('adv', 'Couplers and bus load', 'filter', '🧱', 'Couplers and filter tables', { lvl: 'Advanced',
  line: 'A coupler forwards a group telegram only if the address is in its <b>filter table</b> (built by ETS from the links that cross the coupler). Individual-address telegrams are routed by the area/line numbers. This keeps lines quiet.',
  body: '<table class="spec"><tr><td>Filter</td><td>Only group addresses used on both sides pass</td></tr><tr><td>Main groups 14/15</td><td>Pass by default in most couplers – avoid using them for normal functions</td></tr><tr><td>Commissioning</td><td>“Pass all” helps during start-up – set back to “filter” afterwards</td></tr><tr><td>Update</td><td>After adding links across lines, download the coupler (filter table) too</td></tr></table>',
  do: 'After every change that links devices on different lines, remember to download the couplers / IP routers.',
  watch: '“It works on my line but not from the other floor” is almost always a coupler filter table that was not updated.',
  quiz: [Q('A coupler forwards a group telegram when…', ['The address is in its filter table', 'Always', 'Never'], 0), Q('After linking devices across lines you must also…', ['Download the coupler', 'Replace the cable', 'Restart the supply'], 0), Q('“Pass all” mode should be used…', ['Only temporarily during commissioning', 'Permanently', 'Never'], 0)] });
add('adv', 'Couplers and bus load', 'load', '📈', 'Bus load and good habits', { lvl: 'Advanced', lab: 'load',
  line: 'A TP line carries roughly <b>40–50 telegrams per second</b> at most. Cyclic sending, “send on every small change” and many visualisation reads can fill it. Keep the average well below <b>~30–40 %</b>.',
  body: '<table class="spec"><tr><td>Cyclic values</td><td>Temperatures every 10–15 min (or on change > 0.5 K), not every second</td></tr><tr><td>Presence</td><td>Send on change, not cyclically</td></tr><tr><td>Lux</td><td>Send on change > 10–20 %</td></tr><tr><td>Visualisation</td><td>Listen to status, do not poll with reads</td></tr><tr><td>Couplers</td><td>Filter so local traffic stays local</td></tr></table>',
  do: 'After commissioning watch the bus monitor for 10 minutes with nobody touching anything – the line should be almost silent.',
  watch: 'A line at 70 % load loses telegrams at peak times (central OFF + scenes) – users see lights that “sometimes” do not react.',
  quiz: [Q('A TP line carries at most about…', ['40–50 telegrams/s', '5000 telegrams/s', '1 telegram/s'], 0), Q('A good cyclic time for room temperatures:', ['10–15 min (or on change)', 'Every 100 ms', 'Never'], 0), Q('A quiet line with nobody using it shows…', ['Almost no traffic', 'Constant 80 % load', 'Only repeats'], 0)] });
add('adv', 'Logic and integration', 'logic', '🧠', 'Logic, scenes, timers and integration', { lvl: 'Advanced',
  line: 'Beyond simple links: <b>logic gates</b> and <b>timers</b> inside actuators/push-buttons or a logic server, <b>scenes</b> across trades, and <b>integration</b> with BMS (BACnet/Modbus), DALI, AV and access control.',
  body: '<table class="spec"><tr><td>Device logic</td><td>Many JUNG devices have AND/OR, gate, disable and threshold functions in parameters</td></tr><tr><td>Logic server / visualisation</td><td>Complex logic, astro timers, calendars, alarms, e-mails</td></tr><tr><td>Scenes</td><td>Lighting + blinds + HVAC in one press (DPT 17/18)</td></tr><tr><td>BMS</td><td>KNX ↔ BACnet / Modbus gateways; agree a points list</td></tr><tr><td>Energy</td><td>Meters and current detection to KNX; load shedding</td></tr></table>',
  do: 'Put logic as close to the devices as possible (inside actuators/sensors) – the system still works when a server is down.',
  watch: 'Logic hidden in a visualisation server that nobody documented becomes the reason “the building stops working” when the server is replaced.',
  quiz: [Q('Where is the most robust place for simple logic?', ['Inside the KNX devices', 'In a cloud service', 'In a spreadsheet'], 0), Q('One press setting lights, blinds and HVAC uses…', ['A scene', 'A coupler', 'An FDSK'], 0), Q('KNX to BACnet integration is done by…', ['A gateway and an agreed points list', 'Changing the cable', 'DALI'], 0)] });
add('adv', 'Troubleshooting and handover', 'fault', '🔍', 'Advanced troubleshooting', { lvl: 'Advanced',
  line: 'Fault-find methodically: <b>power and voltage</b> → <b>device answers</b> (address check) → <b>telegram sent?</b> (group monitor) → <b>right address, flags, DPT?</b> → <b>coupler filter</b> → <b>bus load / repeats</b>.',
  body: '<table class="spec"><tr><td>No device answers</td><td>Supply off, short circuit, polarity, bus voltage < 21 V</td></tr><tr><td>One device missing</td><td>Bus terminal, damaged device, address changed</td></tr><tr><td>Telegram but no action</td><td>Missing link, W flag, wrong DPT size, coupler filter</td></tr><tr><td>Wrong LED / visualisation</td><td>Status address missing, T flag, two R flags</td></tr><tr><td>Random misses</td><td>Bus load, repeats, low voltage at line end</td></tr></table>',
  do: 'Keep a log of faults and fixes per project – the next technician starts from your notes.',
  watch: 'Never “download all” on a running building to fix one device – one wrong parameter set can stop many rooms. Partial downloads, one device at a time.',
  quiz: [Q('No device on a line answers. First check:', ['Power supply / bus voltage / short circuit', 'Scene numbers', 'Visualisation colours'], 0), Q('A telegram is seen but the actuator does not react. Check…', ['Link, W flag, DPT, coupler filter', 'Lux meter', 'Paint'], 0), Q('Fixing one device in a running building:', ['Partial download of that device', 'Download everything', 'Unload the whole line'], 0)] });
add('adv', 'Troubleshooting and handover', 'hand', '📁', 'Documentation and handover', { lvl: 'Advanced',
  line: 'Hand over a system anyone can maintain: the <b>ETS project</b> (and password / keyring for Secure), <b>FDSK list</b>, group-address list, device list with individual addresses and locations, panel drawings, test records and user guides.',
  body: '<table class="spec"><tr><td>ETS</td><td>.knxproj + project password + keyring (Secure)</td></tr><tr><td>Lists</td><td>Group addresses with DPT and description; devices with individual address, room, board</td></tr><tr><td>Drawings</td><td>Topology, board layouts, bus routes</td></tr><tr><td>Records</td><td>Bus voltage per line, function tests signed by the client</td></tr><tr><td>Users</td><td>Short guide per room type; training session record</td></tr></table>',
  do: 'Store a copy of everything in the project folder and give the client theirs on a USB stick and by secure transfer.',
  watch: 'Without the ETS project, the next integrator must re-read every device – clients remember who caused that.',
  quiz: [Q('What must be handed over for a Secure project?', ['ETS project, password, keyring and FDSKs', 'Only the invoice', 'Only photos'], 0), Q('Device list should include…', ['Individual address, room and board', 'Only prices', 'Nothing'], 0), Q('Function tests should be…', ['Recorded and signed by the client', 'Skipped', 'Verbal only'], 0)] });

    $('jrOut').innerHTML = `<div class="tablewrap"><table class="spec">${rows.map(([n, q]) => `<tr><td>${n}</td><td><b>${q}</b></td></tr>`).join('')}</table></div>` + kpi([[`${bus}`, 'bus devices'], [`${lines}`, 'lines (≤ 50 devices each)'], ['+20 %', 'spare channels included']]) + '<p class="m" style="font-size:13px">A first estimate – pick exact JUNG articles and channel counts from the current catalogue and confirm DALI groups with the lighting design.</p>'; });
};

start();
</script>
