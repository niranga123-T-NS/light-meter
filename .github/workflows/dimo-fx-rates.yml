# Exchange rates for the Home dashboards: the Central Bank of Sri Lanka daily indicative rates (USD, EUR, GBP) and the
# Sri Lanka Customs weekly schedule (read with OCR from the scanned PDF on the Customs website). The Commercial Bank
# report is uploaded in the app by the Operations Executive.
# Uses the same repository secrets as the backend deploy (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, DISPATCH_SECRET).
name: DIMO – exchange rates

on:
  schedule:
    - cron: '20 6 * * 1-5'   # 11:50 Sri Lanka – after the Central Bank publishes
    - cron: '40 11 * * *'    # 17:10 Sri Lanka – late publications and next week's Customs schedule
  workflow_dispatch:
    inputs:
      backfill_days:
        description: On the first run, how many days of Central Bank history to load
        default: '400'

concurrency: dimo-fx-rates

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dimo-lighting-ops
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FX_SECRET: ${{ secrets.DISPATCH_SECRET }}
      BACKFILL_DAYS: ${{ inputs.backfill_days || '400' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null && pip install -q pillow
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Fetch and save the rates
        run: |
          key=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | jq -r '[.[] | select(.name == "anon" or .type == "publishable")][0].api_key')
          if [ -z "$key" ] || [ "$key" = "null" ]; then echo "::error::Could not read the project's public (anon) key"; exit 1; fi
          echo "::add-mask::$key"
          SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_ANON_KEY="$key" python3 scripts/fx_fetch.py
