# Builds the DIMO Lighting Ops Android app in the Expo cloud (EAS) – no computer needed.
# Run it from GitHub → Actions → "DIMO – build Android app" → Run workflow.
#
# Repository secret needed (Settings → Secrets and variables → Actions → New repository secret):
#   EXPO_TOKEN – expo.dev → Account settings → Access tokens → Create token
#
# Profiles (eas.json):
#   preview    – an .apk you install directly on phones (internal testing / company use)
#   production – an .aab for the Google Play Store
name: DIMO – build Android app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dimo-lighting-ops
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN repository secret first (expo.dev → Account settings → Access tokens)"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Signed in to Expo as
        run: npx eas-cli@latest whoami

      # Push notifications on Android need Firebase: the google-services.json file is kept as a secret
      # (GOOGLE_SERVICES_JSON) and added to this build only.
      - name: Add Firebase config for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set – the app builds, but Android push notifications will not be delivered."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          jq -e '.project_info.project_id' google-services.json > /dev/null || { echo "::error::GOOGLE_SERVICES_JSON is not a valid google-services.json"; exit 1; }
          jq '.expo.android.googleServicesFile = "./google-services.json"' app.json > app.tmp.json && mv app.tmp.json app.json
          echo "Firebase project: $(jq -r '.project_info.project_id' google-services.json)"

      # Creates (first run) or links the Expo project and writes its projectId into app.json for this build.
      - name: Link the Expo project
        run: npx eas-cli@latest init --non-interactive --force

      - name: Build on EAS (Android, ${{ inputs.profile }})
        run: |
          npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive --json > build.json
          cat build.json

      - name: Summary
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          id=$(jq -r '.[0].id' build.json)
          project=$(jq -r '.[0].project.fullName // empty' build.json); project=${project#@}
          {
            echo "### Android build finished (${{ inputs.profile }})"
            echo ""
            echo "**Download:** $url"
            echo ""
            echo "Build page: https://expo.dev/accounts/${project%%/*}/projects/${project#*/}/builds/$id"
            echo ""
            echo "Open the download link on an Android phone to install (allow installs from this source when asked)."
          } >> "$GITHUB_STEP_SUMMARY"
