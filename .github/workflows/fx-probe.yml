name: fx probe (temporary)
on:
  push:
    branches: [claude/fx-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null && pip install -q pillow
      - run: |
          mkdir -p fxprobe
          BACKFILL_DAYS=20 python3 fx_fetch.py --dry-run 2>&1 | tee fxprobe/dry.txt
          # OCR text of the latest schedule for checking
          python3 -c "
          import fx_fetch as f, re, datetime as dt
          page=f.get('https://www.customs.gov.lk/exchange-rates/')
          found=re.findall(r'href=\"([^\"]+\.pdf)\"[^>]*>\s*Effective from (\d\d\.\d\d\.\d{4})', page)[:12]
          hist=f.cbsl('2026-06-01')
          for u2,e in found:
              eff=f.dmy(e); ref=hist[max(d for d in hist if d<eff)]
              print(u2.split('/')[-1], f.read_customs(f.get(u2,True), ref))
          " 2>&1 | tee fxprobe/more.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add fxprobe; git commit -m "probe output [skip ci]"; git push
