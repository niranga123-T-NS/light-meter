# Supabase CLI project config (used by `supabase link`, `supabase db push`, `supabase functions deploy`).
project_id = "dimo-lighting-ops"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://*.vercel.app"]
enable_signup = false

[storage]
file_size_limit = "50MiB"

# Called by pg_cron with a shared secret (no user JWT)
[functions.push-dispatch]
verify_jwt = false

[functions.admin-users]
verify_jwt = true
