name: fx probe (temporary)
on:
  push:
    branches: [claude/fx-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          i=0
          for u in \
            https://www.cbsl.gov.lk/cbsl_custom/param/ratewindow.php \
            https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates \
            https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates/daily-indicative-usd-rates \
            https://www.cbsl.gov.lk/en/rates-and-indicators/exchange-rates/daily-buying-and-selling-rate \
            https://www.cbsl.gov.lk/rates-and-indicators/exchange-rates \
            https://www.combank.lk/rates-tariff \
            https://www.customs.gov.lk/exchange-rates/ \
            https://www.customs.gov.lk/ \
            "https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP" \
            "https://api.frankfurter.dev/v2/rates?providers=CBSL" ; do
            i=$((i+1)); echo "== $i $u" | tee -a index.txt
            curl -sS -L -m 40 -A "$UA" -o "p$i.html" -w "%{http_code} %{size_download} %{url_effective}\n" "$u" 2>&1 | tee -a index.txt || true
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: fx-probe
          path: out
