# Deploys the DIMO Lighting Ops backend to Supabase from GitHub (no computer needed).
# Run it from GitHub → Actions → "DIMO – deploy backend (Supabase)" → Run workflow.
#
# Repository secrets needed (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  – supabase.com → Account → Access Tokens → Generate new token
#   SUPABASE_DB_PASSWORD   – the database password chosen when the project was created
#   SUPABASE_PROJECT_REF   – Project Settings → General → Project ID (e.g. abcdefghijklmnop)
#   DISPATCH_SECRET        – any long random text; the same value goes into Vault as 'dispatch_secret'
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   APP_URL                – the web portal address once it is on Vercel
name: DIMO – deploy backend (Supabase)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Load the seed data (master lists, SLA defaults, settings) – safe to repeat
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dimo-lighting-ops
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.DISPATCH_SECRET }}" ] && missing="$missing DISPATCH_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations${{ inputs.seed && ' and seed' || '' }}
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD" ${{ inputs.seed && '--include-seed' || '' }}

      - name: Set Edge Function secrets
        run: supabase secrets set --project-ref "$PROJECT_REF" DISPATCH_SECRET="${{ secrets.DISPATCH_SECRET }}" APP_URL="${{ vars.APP_URL || 'http://localhost:8081' }}"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy push-dispatch --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy admin-users --project-ref "$PROJECT_REF"

      - name: Summary
        run: |
          echo "### Backend deployed to project $PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: run the Vault SQL and create the first admin (see the implementation guide, iPad section)." >> "$GITHUB_STEP_SUMMARY"
